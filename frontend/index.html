<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Tech Alvo</title>
</head>
<body>
    <h1>Gestão de Produtos</h1>

    <h3>Cadastrar Produto</h3>
    <input type="text" name="nome" id="nome" placeholder="Nome do Produto">
    <input type="text" name="tipo" id="tipo" placeholder="Tipo (ex:Cereal)">
    <button onclick="carregarProduto()">Cadastrar</button>

    <h3>Lista de Produtos</h3>
    <ul id="listaProdutos">
    </ul>
    <hr>
    <h1>Gestão de estoque</h1>
    <h3>Cadastrar Estoque</h3>
    <input type="number" name="produto_id" id="produto_id" placeholder="ID do Produto">
    <input type="number" name="quantidade" id="quantidade" placeholder="Quantidade">
    <button onclick="CadastrarEstoque()">Adicionar ao Estoque</button>
    <h3>Estoque Atual</h3>
    <ul id="listaEstoque">

    </ul>
    <script src="script.js"></script>
</body>
</html>
